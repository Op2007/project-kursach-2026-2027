<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход — Ларец</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Навигация -->
<nav class="navbar">
    <div class="nav-logo">
        <a href="index.html"><img src="img/logo (2).png" alt="logo"></a>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">о нас</a></li>
        <li><a href="catalog.html">книги</a></li>
        <li><a href="#">сопутствующие товары</a></li>
    </ul>
    <div class="search-box">
        <input type="text" placeholder="найти книгу">
        <div class="search-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
    </div>
    <div class="nav-icons">
        <div class="nav-icon">
            <img src="img/ларец.png" alt="basket">
        </div>
        <div class="nav-icon">
            <img src="img/ежик-пользователь.png" alt="user">
        </div>
    </div>
</nav>

<div class="page-wrapper">
    <div class="side-ornament left"></div>
    
    <div class="login-card">
        <div class="card-rooster">
            <img src="img/petux.png" alt="petux">
        </div>
        <h1>вход</h1>
        
        <form id="loginForm" novalidate>
            <div class="form-group">
                <input type="email" id="loginEmail" placeholder="Введите вашу почту" autocomplete="email">
                <div class="error-msg" id="loginEmailError">Введите почту</div>
            </div>
            
            <div class="form-group">
                <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
                <div class="error-msg" id="loginPasswordError">Введите пароль</div>
            </div>
            <div class="perehod">
              <p>Ещё нет аккаунта?<a href="register.html">Создать!</a></p>
            </div>
            
            <button type="submit" class="btn-login">войти</button>
            <div class="success-msg" id="loginSuccessMsg">✓ Вход выполнен успешно!</div>
        </form>
    </div>
    
    <div class="side-ornament right"></div>
</div>

<script>
const form = document.getElementById('loginForm');
const emailIn = document.getElementById('loginEmail');
const passIn = document.getElementById('loginPassword');
const success = document.getElementById('loginSuccessMsg');

function validateEmail() {
  const v = emailIn.value.trim();
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const errEl = document.getElementById('loginEmailError');
  if (!v) { errEl.textContent = 'Поле обязательно для заполнения'; emailIn.classList.add('error'); return false; }
  if (!emailRegex.test(v)) { errEl.textContent = 'Введите корректный адрес электронной почты'; emailIn.classList.add('error'); return false; }
  emailIn.classList.remove('error');
  return true;
}

function validatePassword() {
  const v = passIn.value;
  const errEl = document.getElementById('loginPasswordError');
  if (!v) { errEl.textContent = 'Поле обязательно для заполнения'; passIn.classList.add('error'); return false; }
  if (v.length < 6) { errEl.textContent = 'Пароль должен содержать минимум 6 символов'; passIn.classList.add('error'); return false; }
  passIn.classList.remove('error');
  return true;
}

emailIn.addEventListener('input', () => emailIn.classList.remove('error'));
passIn.addEventListener('input', () => passIn.classList.remove('error'));

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  success.classList.remove('show');
  const okEmail = validateEmail();
  const okPass  = validatePassword();
  if (okEmail && okPass) {
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailIn.value.trim(), password: passIn.value })
      });
      const data = await res.json();
      if (data.success) {
        success.classList.add('show');
        setTimeout(() => { window.location.href = 'profile.html'; }, 1500);
      } else {
        alert('Ошибка: ' + (data.message || 'Неверные данные'));
      }
    } catch (err) { console.error(err); alert('Ошибка сервера'); }
  }
});
</script>
</body>
</html>
